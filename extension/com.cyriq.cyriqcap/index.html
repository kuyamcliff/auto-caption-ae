<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyriqCap</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand"><span class="mark" id="brandMark"></span><span class="name">Cyriq<b>Cap</b></span></div>
      <div class="spacer"></div>
      <button class="pill" id="apiPill" title="API folder"><span class="dot" id="apiDot"></span><span id="apiText">API</span></button>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="captions" class="active"><i data-icon="captions"></i><span>Auto Caption</span></button>
      <button data-tab="animate"><i data-icon="sparkle"></i><span>Text Animation</span></button>
      <button data-tab="help"><i data-icon="help"></i><span>Help</span></button>
      <button data-tab="settings"><i data-icon="gear"></i><span>Settings</span></button>
      <div class="ink" id="tabInk"></div>
    </nav>
    <main>
      <section class="view active" id="view-captions"></section>
      <section class="view" id="view-animate"></section>
      <section class="view" id="view-help"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>
  <div id="toasts"></div>

  <script src="js/core/expr.js"></script>
  <script src="js/core/presets.js"></script>
  <script src="js/core/preview.js"></script>
  <script src="js/core/builder.js"></script>
  <script src="js/core/captions.js"></script>
  <script src="js/core/languages.js"></script>
  <script src="js/services/services.js"></script>
  <script src="js/lib/mock-host.js"></script>
  <script src="js/lib/cep.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/view-captions.js"></script>
  <script src="js/ui/view-animate.js"></script>
  <script src="js/ui/view-help.js"></script>
  <script src="js/ui/view-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
